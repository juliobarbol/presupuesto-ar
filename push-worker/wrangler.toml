name = "presupuesto-push"
main = "index.js"
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "PUSH_KV"
id = "21623cf5895f4789a6a4d4a688b9e686"

[triggers]
# Cada 15 minutos: los avisos con horario (recordatorio 1 h antes, "mañana
# tenés trabajo") salen a su hora. Seguimientos y vencimientos siguen saliendo
# solo a las 9, 14 y 19 h del teléfono (el Worker lo filtra adentro).
crons = ["*/15 * * * *"]
